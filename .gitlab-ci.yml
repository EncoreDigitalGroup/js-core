# GitLab CI Pipeline — tsfmt
#
# Required CI/CD Variables (Settings > CI/CD > Variables):
#   ENCOREBOT_ACCESS_TOKEN  — masked; project/group access token with `api` scope,
#                             used by the release job to create the GitLab Release
#                             and auto-generate notes from merged MRs.
#   NPM_TOKEN               — masked + protected; npm access token with publish
#                             rights on the tsfmt package at registry.npmjs.org.
#
# Required project setting:
#   Settings > Repository > Protected tags must include v*.*.* so NPM_TOKEN is
#   available to the publish job.
#
# Pipeline overview:
#   build (MR + web) → release (semver tags) → publish (stable tags only)

workflow:
    auto_cancel:
        on_new_commit: interruptible

include:
    -   project: internal/ci-pipelines
        ref: main
        file:
            - /workflows/bun/build.yml
            - /workflows/gitlab/create-release.yml

stages:
    - quality
    - release

build:
    stage: quality
    extends: .bun:build
    interruptible: true
    variables:
        COMMIT_BUILD: "false"
    rules:
        -   if: $CI_PIPELINE_SOURCE == "merge_request_event"
        -   if: $CI_PIPELINE_SOURCE == "web"

release:
    stage: release
    extends: .gitlab:create-release
    interruptible: false
    variables:
        ENCOREBOT_ACCESS_TOKEN: $ENCOREBOT_ACCESS_TOKEN
    rules:
        -   if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\d+)?$/

publish:
    extends: .bun:build
    stage: release
    interruptible: false
    needs: [ release ]
    variables:
        NPM_TOKEN: $NPM_TOKEN
    script:
        - bun install --frozen-lockfile
        - bun scripts/build.ts --publish
    rules:
        -   if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
